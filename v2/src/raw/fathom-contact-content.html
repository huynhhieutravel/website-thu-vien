ation-300 placeholder:text-white/25 focus:border-white/45 mt-3" id="subject" name="subject" placeholder="Optional" type="text"/></div><div><label class="font-mono text-[0.68rem] uppercase tracking-[0.14em] text-white/50" for="message">Message</label><textarea class="w-full border-b border-white/15 bg-transparent pb-3 pt-2 text-[0.98rem] text-paper caret-white/70 outline-none transition-colors duration-300 placeholder:text-white/25 focus:border-white/45 mt-3 resize-none" id="message" name="message" placeholder="Whatever you would like to say" required="" rows="5"></textarea></div><div class="flex flex-wrap items-center gap-6 pt-2"><button class="rounded-full border border-white/20 px-6 py-3 font-mono text-[0.7rem] uppercase tracking-[0.14em] text-white/70 transition-colors duration-300 hover:border-white/45 hover:text-white disabled:cursor-not-allowed disabled:opacity-40" type="submit">Send message</button><p aria-live="polite" class="font-mono text-[0.68rem] uppercase tracking-[0.14em] transition-opacity duration-300 opacity-0" role="status"></p></div></form></div></div></div></main>
